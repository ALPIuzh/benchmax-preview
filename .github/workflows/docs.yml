name: documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12 --group docs --group notebook --group dev --no-default-groups
      - name: Check notebook quality without modifying files
        run: |
          uv run --no-sync python .github/scripts/normalize_notebooks.py --check notebooks/*.ipynb
          uv run --no-sync ruff check --no-fix notebooks/*.ipynb
      - run: uv run --no-sync sphinx-build -b html --keep-going docs docs/_build/html
      - run: uv run --no-sync python docs/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
